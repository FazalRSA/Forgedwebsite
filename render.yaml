# Render Blueprint: deploys the site as a static site on Render's CDN.
# In Render: New > Blueprint > pick this repository. Every push to main redeploys.
services:
  - type: web
    name: forged-custom-wheels
    runtime: static
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Each real page is served from its own prerendered HTML file (written by
      # scripts/prerender-meta.ts), so link-preview bots get that page's title and picture.
      # This block is generated by scripts/generate-sitemap.ts; do not edit it by hand.
      # BEGIN generated page routes
      - type: rewrite
        source: /wheels/fsa002-gold
        destination: /wheels/fsa002-gold.html
      - type: rewrite
        source: /wheels/ff-1-silver
        destination: /wheels/ff-1-silver.html
      - type: rewrite
        source: /wheels/ff-1-liquid-metal
        destination: /wheels/ff-1-liquid-metal.html
      - type: rewrite
        source: /wheels/fsa003-hyper-black
        destination: /wheels/fsa003-hyper-black.html
      - type: rewrite
        source: /wheels/fsa004-silver
        destination: /wheels/fsa004-silver.html
      - type: rewrite
        source: /wheels/ff-3-pure-bronze
        destination: /wheels/ff-3-pure-bronze.html
      - type: rewrite
        source: /wheels/ff-3-glossy-black
        destination: /wheels/ff-3-glossy-black.html
      - type: rewrite
        source: /wheels/ff-3-liquid-metal
        destination: /wheels/ff-3-liquid-metal.html
      - type: rewrite
        source: /wheels/fsa001-black-matte
        destination: /wheels/fsa001-black-matte.html
      - type: rewrite
        source: /wheels/fsa002-hyper-black
        destination: /wheels/fsa002-hyper-black.html
      - type: rewrite
        source: /wheels/fsa002-polished-face
        destination: /wheels/fsa002-polished-face.html
      - type: rewrite
        source: /wheels/fsa003-silver
        destination: /wheels/fsa003-silver.html
      - type: rewrite
        source: /wheels/fsa004-hyper-black
        destination: /wheels/fsa004-hyper-black.html
      - type: rewrite
        source: /wheels/fsa004-gloss-black
        destination: /wheels/fsa004-gloss-black.html
      - type: rewrite
        source: /installs
        destination: /installs.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy.html
      # END generated page routes
      # Client-side routing: any other path that is not a real file serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints everything in /assets, so it can be cached for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # 3D models and photos keep their file names when they change; cache for a day.
      - path: /models/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
