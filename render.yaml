# Render Blueprint: deploys the site as a static site on Render's CDN.
# In Render: New > Blueprint > pick this repository. Every push to main redeploys.
services:
  - type: web
    name: forged-custom-wheels
    runtime: static
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Each real page is served from its own prerendered HTML file (written by
      # scripts/prerender-meta.ts), so link-preview bots get that page's title and picture.
      # This block is generated by scripts/generate-sitemap.ts; do not edit it by hand.
      # BEGIN generated page routes
      - type: rewrite
        source: /wheels/fsa003-gold
        destination: /wheels/fsa003-gold.html
      - type: rewrite
        source: /wheels/ff-1-silver
        destination: /wheels/ff-1-silver.html
      - type: rewrite
        source: /wheels/ff-1-liquid-metal
        destination: /wheels/ff-1-liquid-metal.html
      - type: rewrite
        source: /wheels/fsa003-hyper-black
        destination: /wheels/fsa003-hyper-black.html
      - type: rewrite
        source: /wheels/fsa004-silver
        destination: /wheels/fsa004-silver.html
      - type: rewrite
        source: /wheels/ff-3-pure-bronze
        destination: /wheels/ff-3-pure-bronze.html
      - type: rewrite
        source: /wheels/ff-3-glossy-black
        destination: /wheels/ff-3-glossy-black.html
      - type: rewrite
        source: /wheels/ff-3-liquid-metal
        destination: /wheels/ff-3-liquid-metal.html
      - type: rewrite
        source: /wheels/fsa001-black-matte
        destination: /wheels/fsa001-black-matte.html
      - type: rewrite
        source: /wheels/fsa002-hyper-black
        destination: /wheels/fsa002-hyper-black.html
      - type: rewrite
        source: /wheels/fsa002-polished-face
        destination: /wheels/fsa002-polished-face.html
      - type: rewrite
        source: /wheels/fsa004-gloss-black
        destination: /wheels/fsa004-gloss-black.html
      - type: rewrite
        source: /wheels/fsa003-silver
        destination: /wheels/fsa003-silver.html
      - type: rewrite
        source: /wheels/fsa004-hyper-black
        destination: /wheels/fsa004-hyper-black.html
      - type: rewrite
        source: /blog
        destination: /blog.html
      - type: rewrite
        source: /blog/forged-wheel-basics
        destination: /blog/forged-wheel-basics.html
      - type: rewrite
        source: /blog/bmw-m-wheel-fitment
        destination: /blog/bmw-m-wheel-fitment.html
      - type: rewrite
        source: /blog/buying-forged-wheels-south-africa
        destination: /blog/buying-forged-wheels-south-africa.html
      - type: rewrite
        source: /blog/wheel-care
        destination: /blog/wheel-care.html
      - type: rewrite
        source: /blog/forged-wheel-basics/forged-vs-cast-vs-flow-formed-wheels
        destination: /blog/forged-wheel-basics/forged-vs-cast-vs-flow-formed-wheels.html
      - type: rewrite
        source: /blog/forged-wheel-basics/unsprung-weight-explained
        destination: /blog/forged-wheel-basics/unsprung-weight-explained.html
      - type: rewrite
        source: /blog/forged-wheel-basics/are-forged-wheels-worth-it
        destination: /blog/forged-wheel-basics/are-forged-wheels-worth-it.html
      - type: rewrite
        source: /blog/bmw-m-wheel-fitment/wheel-fitment-explained-pcd-offset-centre-bore
        destination: /blog/bmw-m-wheel-fitment/wheel-fitment-explained-pcd-offset-centre-bore.html
      - type: rewrite
        source: /blog/bmw-m-wheel-fitment/bmw-g80-m3-forged-wheels
        destination: /blog/bmw-m-wheel-fitment/bmw-g80-m3-forged-wheels.html
      - type: rewrite
        source: /blog/bmw-m-wheel-fitment/staggered-vs-square-wheel-setups
        destination: /blog/bmw-m-wheel-fitment/staggered-vs-square-wheel-setups.html
      - type: rewrite
        source: /blog/buying-forged-wheels-south-africa/how-much-do-forged-wheels-cost-in-south-africa
        destination: /blog/buying-forged-wheels-south-africa/how-much-do-forged-wheels-cost-in-south-africa.html
      - type: rewrite
        source: /blog/buying-forged-wheels-south-africa/in-stock-vs-made-to-order-forged-wheels
        destination: /blog/buying-forged-wheels-south-africa/in-stock-vs-made-to-order-forged-wheels.html
      - type: rewrite
        source: /blog/buying-forged-wheels-south-africa/choosing-a-wheel-finish-for-your-bmw-m-car
        destination: /blog/buying-forged-wheels-south-africa/choosing-a-wheel-finish-for-your-bmw-m-car.html
      - type: rewrite
        source: /blog/wheel-care/how-to-clean-forged-wheels
        destination: /blog/wheel-care/how-to-clean-forged-wheels.html
      - type: rewrite
        source: /blog/wheel-care/wheel-bolt-torque-and-care
        destination: /blog/wheel-care/wheel-bolt-torque-and-care.html
      - type: rewrite
        source: /blog/wheel-care/protecting-wheels-from-potholes
        destination: /blog/wheel-care/protecting-wheels-from-potholes.html
      - type: rewrite
        source: /installs
        destination: /installs.html
      - type: rewrite
        source: /forged-sa-wheels
        destination: /forged-sa-wheels.html
      - type: rewrite
        source: /sixnine-wheels
        destination: /sixnine-wheels.html
      - type: rewrite
        source: /sixnine-wheels/ff-one
        destination: /sixnine-wheels/ff-one.html
      - type: rewrite
        source: /sixnine-wheels/ff-two
        destination: /sixnine-wheels/ff-two.html
      - type: rewrite
        source: /sixnine-wheels/ff-three
        destination: /sixnine-wheels/ff-three.html
      - type: rewrite
        source: /sixnine-wheels/evo-one
        destination: /sixnine-wheels/evo-one.html
      - type: rewrite
        source: /sixnine-wheels/evo-two
        destination: /sixnine-wheels/evo-two.html
      - type: rewrite
        source: /sixnine-wheels/oem-plus-one
        destination: /sixnine-wheels/oem-plus-one.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy.html
      # END generated page routes
      # Client-side routing: any other path that is not a real file serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints everything in /assets, so it can be cached for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # 3D models and photos keep their file names when they change; cache for a day.
      - path: /models/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
