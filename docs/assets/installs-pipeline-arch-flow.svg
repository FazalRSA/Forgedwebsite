<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="t d">
  <title id="t">Installs pipeline: from Drive photos to the Installs page</title>
  <desc id="d">Phone photos in Drive are described in jobs.json, rendered by reshoot_car.py through OpenRouter, reviewed on a QA sheet, then build_site_data.py writes the WebP images and clientFitments.ts that the Installs page reads.</desc>
  <style>
    @keyframes glow-blue { 0%,100% { filter: drop-shadow(0 0 3px #4a9eff); } 50% { filter: drop-shadow(0 0 14px #4a9eff); } }
    @keyframes glow-orange { 0%,100% { filter: drop-shadow(0 0 3px #ff9900); } 50% { filter: drop-shadow(0 0 14px #ff9900); } }
    @keyframes glow-green { 0%,100% { filter: drop-shadow(0 0 3px #3fb950); } 50% { filter: drop-shadow(0 0 14px #3fb950); } }
    .glow-blue { animation: glow-blue 3s ease-in-out infinite; }
    .glow-orange { animation: glow-orange 3s ease-in-out infinite; }
    .glow-green { animation: glow-green 3s ease-in-out infinite; }
    @keyframes flow { 0% { opacity: 0; offset-distance: 0%; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { opacity: 0; offset-distance: 100%; } }
    .dot { r: 5; offset-rotate: 0deg; animation: flow 3s linear infinite; }
    .p1 { fill: #4a9eff; offset-path: path("M 190 84 L 240 84"); animation-duration: 2s; }
    .p2 { fill: #4a9eff; offset-path: path("M 390 84 L 440 84"); animation-duration: 2s; animation-delay: 0.6s; }
    .p3 { fill: #4a9eff; offset-path: path("M 590 84 L 660 84"); animation-duration: 2s; animation-delay: 1.2s; }
    .p4 { fill: #4a9eff; offset-path: path("M 760 108 L 760 200"); animation-duration: 2.4s; animation-delay: 1.8s; }
    .p5 { fill: #ff9900; offset-path: path("M 660 224 L 590 224"); animation-duration: 2s; animation-delay: 2.4s; }
    .p6 { fill: #ff9900; offset-path: path("M 440 224 L 315 224 L 315 108"); animation-duration: 3s; animation-delay: 3s; }
    .p7 { fill: #4a9eff; offset-path: path("M 760 248 L 760 330"); animation-duration: 2.4s; animation-delay: 2.4s; }
    .p8 { fill: #79c0ff; offset-path: path("M 40 84 L 20 84 L 20 300 L 735 300 L 735 330"); animation-duration: 5s; animation-delay: 0.4s; }
    .p8b { fill: #79c0ff; offset-path: path("M 40 84 L 20 84 L 20 300 L 735 300 L 735 330"); animation-duration: 5s; animation-delay: 2.9s; }
    .p9 { fill: #79c0ff; offset-path: path("M 115 200 L 115 150 L 515 150 L 515 108"); animation-duration: 4s; animation-delay: 1s; }
    .p10 { fill: #3fb950; offset-path: path("M 660 354 L 630 354"); animation-duration: 1.6s; animation-delay: 0.2s; }
    .p11 { fill: #3fb950; offset-path: path("M 735 378 L 735 440"); animation-duration: 2s; animation-delay: 0.8s; }
    .p12 { fill: #3fb950; offset-path: path("M 535 378 L 535 440"); animation-duration: 2s; animation-delay: 1.4s; }
    .p13 { fill: #3fb950; offset-path: path("M 660 464 L 630 464"); animation-duration: 1.6s; animation-delay: 2s; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4a9eff"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ff9900"/></marker>
    <marker id="al" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#79c0ff"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/></marker>
  </defs>
  <rect width="900" height="570" fill="#0d1117"/>
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="14">Installs pipeline</text>

  <!-- arrows -->
  <line x1="190" y1="84" x2="232" y2="84" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="390" y1="84" x2="432" y2="84" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="590" y1="84" x2="652" y2="84" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="760" y1="108" x2="760" y2="192" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="660" y1="224" x2="598" y2="224" stroke="#ff9900" stroke-width="1.5" marker-end="url(#ao)"/>
  <path d="M 440 224 L 315 224 L 315 116" fill="none" stroke="#ff9900" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <line x1="760" y1="248" x2="760" y2="322" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M 40 84 L 20 84 L 20 300 L 735 300 L 735 322" fill="none" stroke="#79c0ff" stroke-width="1.5" marker-end="url(#al)"/>
  <path d="M 115 200 L 115 150 L 515 150 L 515 116" fill="none" stroke="#79c0ff" stroke-width="1.5" marker-end="url(#al)"/>
  <line x1="660" y1="354" x2="638" y2="354" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="735" y1="378" x2="735" y2="432" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="535" y1="378" x2="535" y2="432" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="660" y1="464" x2="638" y2="464" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- edge labels -->
  <text x="420" y="142" fill="#8b949e" font-size="10">backdrop plate as last reference</text>
  <text x="330" y="292" fill="#8b949e" font-size="10">phone photo (raw/) for original.webp</text>
  <text x="330" y="240" fill="#8b949e" font-size="10">corrections</text>
  <text x="772" y="158" fill="#8b949e" font-size="10">PNG</text>

  <!-- row 1 -->
  <g class="glow-blue"><rect x="40" y="60" width="150" height="48" rx="8" fill="#161b22" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="115" y="78" text-anchor="middle" fill="#e6edf3" font-size="12">Drive folder</text>
    <text x="115" y="96" text-anchor="middle" fill="#8b949e" font-size="10">phone photos</text></g>
  <g class="glow-blue"><rect x="240" y="60" width="150" height="48" rx="8" fill="#161b22" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="315" y="78" text-anchor="middle" fill="#e6edf3" font-size="12">jobs.json</text>
    <text x="315" y="96" text-anchor="middle" fill="#8b949e" font-size="10">one job per car</text></g>
  <g class="glow-blue"><rect x="440" y="60" width="150" height="48" rx="8" fill="#161b22" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="515" y="78" text-anchor="middle" fill="#e6edf3" font-size="12">reshoot_car.py</text>
    <text x="515" y="96" text-anchor="middle" fill="#8b949e" font-size="10">prompt + references</text></g>
  <g class="glow-blue"><rect x="660" y="60" width="200" height="48" rx="8" fill="#161b22" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="760" y="78" text-anchor="middle" fill="#e6edf3" font-size="12">OpenRouter</text>
    <text x="760" y="96" text-anchor="middle" fill="#8b949e" font-size="10">Gemini 3 Pro Image</text></g>

  <!-- row 2 -->
  <g><rect x="40" y="200" width="150" height="48" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="115" y="218" text-anchor="middle" fill="#e6edf3" font-size="12">backdrop_ref.png</text>
    <text x="115" y="236" text-anchor="middle" fill="#8b949e" font-size="10">empty studio plate</text></g>
  <g class="glow-orange"><rect x="440" y="200" width="150" height="48" rx="8" fill="#161b22" stroke="#ff9900" stroke-width="1.5"/>
    <text x="515" y="218" text-anchor="middle" fill="#e6edf3" font-size="12">QA sheets</text>
    <text x="515" y="236" text-anchor="middle" fill="#8b949e" font-size="10">photo vs renders</text></g>
  <g class="glow-blue"><rect x="660" y="200" width="200" height="48" rx="8" fill="#161b22" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="760" y="218" text-anchor="middle" fill="#e6edf3" font-size="12">out/&lt;slug&gt;/</text>
    <text x="760" y="236" text-anchor="middle" fill="#8b949e" font-size="10">front34 + side, 2400x1800</text></g>

  <!-- row 3 -->
  <g class="glow-green"><rect x="440" y="330" width="190" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="535" y="348" text-anchor="middle" fill="#e6edf3" font-size="12">public/assets/fitments/</text>
    <text x="535" y="366" text-anchor="middle" fill="#8b949e" font-size="10">front34 · side · original .webp</text></g>
  <g class="glow-green"><rect x="660" y="330" width="150" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="735" y="348" text-anchor="middle" fill="#e6edf3" font-size="12">build_site_data.py</text>
    <text x="735" y="366" text-anchor="middle" fill="#8b949e" font-size="10">copy · plates · data</text></g>

  <!-- row 4 -->
  <g class="glow-green"><rect x="440" y="440" width="190" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="535" y="458" text-anchor="middle" fill="#e6edf3" font-size="12">Installs page</text>
    <text x="535" y="476" text-anchor="middle" fill="#8b949e" font-size="10">/installs · 3 photos per car</text></g>
  <g class="glow-green"><rect x="660" y="440" width="150" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="735" y="458" text-anchor="middle" fill="#e6edf3" font-size="12">clientFitments.ts</text>
    <text x="735" y="476" text-anchor="middle" fill="#8b949e" font-size="10">generated, do not edit</text></g>

  <!-- dots -->
  <circle class="dot p1"/><circle class="dot p2"/><circle class="dot p3"/><circle class="dot p4"/>
  <circle class="dot p5"/><circle class="dot p6"/><circle class="dot p7"/><circle class="dot p8"/><circle class="dot p8b"/>
  <circle class="dot p9"/><circle class="dot p10"/><circle class="dot p11"/><circle class="dot p12"/><circle class="dot p13"/>

  <!-- legend -->
  <circle cx="50" cy="525" r="5" fill="#4a9eff"/><text x="60" y="529" fill="#8b949e" font-size="11">Render flow</text>
  <circle cx="190" cy="525" r="5" fill="#79c0ff"/><text x="200" y="529" fill="#8b949e" font-size="11">Reference images</text>
  <circle cx="360" cy="525" r="5" fill="#ff9900"/><text x="370" y="529" fill="#8b949e" font-size="11">Human review and corrections</text>
  <circle cx="600" cy="525" r="5" fill="#3fb950"/><text x="610" y="529" fill="#8b949e" font-size="11">Published to the site</text>
</svg>
